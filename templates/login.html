<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06080f">
<title>Login | SHADOW HOSTING</title>
{% include '_theme.html' %}
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 10%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 10%,transparent 75%);opacity:.5}
.blob{position:fixed;border-radius:50%;filter:blur(100px);z-index:-1;opacity:.45}
.blob.a{width:480px;height:480px;background:#2b55d6;left:-140px;top:-120px;animation:drift 16s ease-in-out infinite alternate}
.blob.b{width:400px;height:400px;background:#0e8fb0;right:-100px;bottom:-120px;animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(50px,40px) scale(1.15)}}
.card{width:100%;max-width:430px;padding:38px 34px 30px;border-radius:28px;background:linear-gradient(180deg,rgba(18,24,42,.92),rgba(9,12,22,.94));border:1px solid var(--line2);box-shadow:0 50px 100px -40px rgba(0,0,0,.9),0 0 90px -30px rgba(91,140,255,.4);backdrop-filter:blur(18px);position:relative;animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang,0deg),transparent 0 70%,rgba(91,140,255,.9),rgba(56,211,245,.9),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinAng 7s linear infinite;pointer-events:none}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinAng{to{--ang:360deg}}
.head{text-align:center;margin-bottom:28px}
.head .logo-mark{width:68px;height:68px;border-radius:22px;font-size:28px;margin:0 auto 18px;animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.head h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.head h1 small{color:var(--acc2)}
.head p{margin:8px 0 0;color:var(--tx3);font-size:14px}
.err{display:flex;gap:10px;align-items:center;padding:12px 14px;margin-bottom:18px;border-radius:12px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:var(--bad);font-size:13.5px;animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.field+.field{margin-top:16px}
.with-ico{position:relative}
.with-ico>i.lead{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:14px;pointer-events:none;transition:color .2s}
.with-ico .input{padding-left:42px;padding-block:13px}
.with-ico:focus-within>i.lead{color:var(--acc2)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:var(--tx3);border-radius:9px}
.eye:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.caps{display:none;margin-top:8px;font-size:12.5px;color:var(--warn)}
.caps.on{display:flex;gap:7px;align-items:center}
.submit{width:100%;margin-top:24px;padding:15px;font-size:15px}
.submit .sp{display:none}
.submit.loading .sp{display:block}.submit.loading .tx{opacity:.8}
.submit .sp{width:16px;height:16px;border:2.5px solid rgba(4,16,31,.3);border-top-color:#04101f;border-radius:50%;animation:spin .7s linear infinite}
.foot{text-align:center;margin-top:22px;color:var(--tx3);font-size:12.5px;display:flex;justify-content:center;gap:8px;align-items:center}
.foot i{color:var(--ok)}
.back{position:fixed;top:20px;left:20px}
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>
<a href="/" class="btn btn-ghost btn-sm back"><i class="fas fa-arrow-left"></i> Home</a>

<main class="card">
  <div class="head">
    <div class="logo-mark"><i class="fas fa-cloud-upload-alt"></i></div>
    <h1>SHADOW <small>HOSTING</small></h1>
    <p>Premium Hosting Solution</p>
  </div>

  {% if error %}
  <div class="err" role="alert"><i class="fas fa-exclamation-triangle"></i> {{ error }}</div>
  {% endif %}

  <form method="POST" id="loginForm" autocomplete="on">
    <label class="field"><span>Username</span>
      <div class="with-ico"><i class="fas fa-user lead"></i>
        <input type="text" name="username" required autocomplete="username" autofocus class="input" placeholder="Enter your username"></div>
    </label>
    <label class="field"><span>Password</span>
      <div class="with-ico"><i class="fas fa-lock lead"></i>
        <input type="password" name="password" id="pw" required autocomplete="current-password" class="input" placeholder="Enter your password" style="padding-right:48px">
        <button type="button" class="eye" id="eye" aria-label="Show password"><i class="fas fa-eye"></i></button></div>
      <div class="caps" id="caps"><i class="fas fa-triangle-exclamation"></i> Caps Lock is on</div>
    </label>
    <button type="submit" class="btn btn-primary submit" id="sub"><span class="sp"></span><span class="tx"><i class="fas fa-sign-in-alt"></i>&nbsp; Login</span></button>
  </form>

  <div class="foot"><i class="fas fa-shield-alt"></i> Secure Access Only</div>
</main>

<script>
const pw=document.getElementById('pw'), eye=document.getElementById('eye');
eye.onclick=()=>{const s=pw.type==='password';pw.type=s?'text':'password';eye.innerHTML='<i class="fas fa-eye'+(s?'-slash':'')+'"></i>';eye.setAttribute('aria-label',s?'Hide password':'Show password')};
pw.addEventListener('keyup',e=>document.getElementById('caps').classList.toggle('on',e.getModifierState&&e.getModifierState('CapsLock')));
document.getElementById('loginForm').addEventListener('submit',()=>{const b=document.getElementById('sub');b.classList.add('loading')});
</script>
</body>
</html>
